# Local Postgres for development: `docker compose up -d --wait`.
# Production runs on Prisma Postgres — this is never deployed.
services:
  db:
    image: postgres:17-alpine
    container_name: sabiha-bakery-db
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery
      POSTGRES_DB: bakery
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery -d bakery"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
